<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cantina do Campus — Simulação</title>
<meta name="description" content="Jogo de simulação empresarial que opera como mini-ERP, para o componente Práticas Administrativas do curso Técnico em Administração.">
<meta name="author" content="Newton Nyamasege Marube">
<meta name="theme-color" content="#123A26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cantina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="icon" href="icone-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
:root{--g:#1F6B3B;--d:#123A26;--m:#6FA287;--ml:#E6EFE7;--ink:#20302A;
      --gy:#5A6B61;          /* 5.30:1 no fundo e 4.81:1 no verde claro — antes 6A7A70 reprovava */
      --bd:#D8E0DA;--warn:#B3261E;
      --amb:#806500;         /* 5.07:1 sobre o amarelo de aviso — antes 8A6D00 ficava em 4.49 */
      --foco:#8A6D00}
*{box-sizing:border-box}

/* Foco visível por teclado (WCAG 2.4.7). Sem isto, quem navega por Tab
   não enxerga onde está. :focus-visible não marca o clique de mouse. */
:focus{outline:none}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px;border-radius:4px;
               box-shadow:0 0 0 5px rgba(255,255,255,.95)}
/* O anel duplo é proposital: o âmbar sozinho tem contraste de 2,6:1 contra o
   verde-escuro do cabeçalho. O halo branco garante a visibilidade nos dois fundos. */

.gl{font-weight:400;font-size:.78em;color:var(--gy)}

/* Por que a demanda foi essa */
.pqs{margin-top:18px;padding-top:14px;border-top:1px solid var(--bd)}
.pqs>h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gy);margin:0 0 10px}
.pq{margin:0 0 16px}
.pq:last-child{margin-bottom:0}
.pq h4{margin:0 0 5px;font-size:14px;color:var(--d);font-weight:600}
.pq ul{margin:0;padding:0;list-style:none}
.pq li{font-size:13px;line-height:1.55;margin:0;display:flex;gap:8px;justify-content:space-between;
       padding:2px 0;border-bottom:1px solid rgba(216,224,218,.6)}
.pq li>span:first-child{color:var(--ink)}
.pq li>span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.pq .sobe{color:var(--g);font-weight:600}
.pq .desce{color:var(--warn);font-weight:600}
.pq .tot{font-size:13px;line-height:1.55;margin:7px 0 0;color:var(--ink)}

/* Diálogo na própria página, no lugar de alert() e confirm() */
.ovl{position:fixed;inset:0;background:rgba(18,58,38,.45);display:flex;
     align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:#fff;border-radius:10px;max-width:460px;width:100%;
     padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dlg h2{margin:0 0 6px;font-size:16px;color:var(--d)}
.dlg p{margin:4px 0;font-size:13.5px;white-space:pre-line}
.dlg .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:#F6F8F6}
header{background:var(--d);color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:16px;margin:0;flex:1;min-width:180px}
.badge{background:rgba(255,255,255,.15);padding:4px 9px;border-radius:20px;font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:4px;background:#fff;padding:8px;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{border:1px solid var(--bd);background:#fff;color:var(--ink);padding:7px 12px;border-radius:18px;font-size:13px;cursor:pointer}
nav button.on{background:var(--g);color:#fff;border-color:var(--g)}
main{padding:12px;max-width:980px;margin:0 auto}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--g)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--d);color:#fff;border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:11px;color:#CFE0D4}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}
th{background:var(--g);color:#fff;font-weight:600}
td.n,th.n{text-align:right}
input,select,textarea{font:inherit;padding:6px;border:1px solid var(--bd);border-radius:6px;width:100%;background:#fff}
textarea{min-height:80px}
label{font-size:12px;color:var(--gy);display:block;margin:6px 0 2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
button.act{background:var(--g);color:#fff;border:none;padding:9px 14px;border-radius:8px;cursor:pointer;font-size:14px}
button.act.sec{background:#fff;color:var(--g);border:1px solid var(--g)}
button.act:disabled{background:#B9C6BD;cursor:not-allowed}
.msg{padding:8px 10px;border-radius:8px;font-size:13px;margin:8px 0}
.ok{background:var(--ml);color:var(--g)}.bad{background:#FCE4E4;color:var(--warn)}.warn{background:#FFF4D6;color:var(--amb)}
.hint{font-size:12px;color:var(--gy)}
.hide{display:none}

/* Números em colunas: alinham verticalmente e param de "dançar" entre rodadas. */
td.n,th.n,.kpi b,.pq li>span:last-child{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* Botão desabilitado: texto escuro sobre superfície clara.
   Branco sobre cinza-claro dava 1,8:1 e era ilegível. */
button.act:disabled{background:var(--bd);color:#3A4A41;cursor:not-allowed}

/* ---- Trilha da rodada: o fluxo consultar > analisar > decidir > ler ---- */
.trilha{display:flex;flex-wrap:wrap;gap:0;margin:0 0 12px;padding:0;list-style:none;
        background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.trilha li{flex:1 1 150px;min-width:0;padding:9px 12px;font-size:12.5px;line-height:1.35;
           border-right:1px solid var(--bd);display:flex;gap:8px;align-items:flex-start;color:var(--gy)}
.trilha li:last-child{border-right:none}
.trilha .num{flex:0 0 20px;height:20px;border-radius:50%;background:var(--bd);color:#3A4A41;
             font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.trilha .feito{background:var(--ml);color:var(--ink)}
.trilha .feito .num{background:var(--g);color:#fff}
.trilha .agora{background:#FFF9E8;color:var(--ink);font-weight:600}
.trilha .agora .num{background:var(--amb);color:#fff}
.trilha b{display:block;font-weight:inherit}
.trilha small{display:block;font-weight:400;font-size:11.5px;color:var(--gy);margin-top:1px}

/* ---- Progresso das rodadas, no cabeçalho ---- */
.prog{display:flex;gap:3px;align-items:center}
.prog i{width:16px;height:5px;border-radius:3px;background:rgba(255,255,255,.28)}
.prog i.f{background:#9FD3B4}
.prog i.a{background:#F6C445}

@media(max-width:640px){
  /* Tabelas largas rolam na horizontal em vez de espremer a coluna. */
  .card table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* Alvo de toque confortável (WCAG 2.5.8 pede 24px; 44px é o conforto real). */
  nav button{min-height:44px;padding:10px 14px;font-size:14px}
  button.act{min-height:44px}
  input,select{min-height:44px}
  .trilha li{flex:1 1 100%;border-right:none;border-bottom:1px solid var(--bd)}
  .trilha li:last-child{border-bottom:none}
  header h1{font-size:15px}
}
@media(prefers-reduced-motion:no-preference){
  .ovl{animation:ent .16s ease-out}
  @keyframes ent{from{opacity:0}to{opacity:1}}
}
</style>
</head>
<body>
<header>
  <h1>Cantina do Campus — Simulação empresarial</h1>
  <span class="badge" id="bTeam">—</span>
  <span class="badge" id="bRole">—</span>
  <span class="badge" id="bRound">Rodada 1</span>
  <span class="badge" id="bCash">R$ 0</span>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
/* ================= CENÁRIO: CANTINA DO CAMPUS ================= */
const CEN = {
  nome:"Cantina do Campus",
  rodadas:5,
  caixaInicial:3000,
  custosFixos:400,          // por rodada
  elasticidade:1.2,
  kMarketing:0.20,
  mktReferencia:200,
  sazonalidade:[1.00,1.15,0.85,1.10,1.00],   // rodada 2 = semana de provas
  produtos:[
    {id:"SAL", nome:"Salgado assado", precoRef:8.00, custoBase:4.00, demandaBase:90, perecivel:true,  estoqueIni:120},
    {id:"BEB", nome:"Bebida",         precoRef:6.00, custoBase:3.00, demandaBase:70, perecivel:false, estoqueIni:100},
    {id:"DOC", nome:"Doce / barra",   precoRef:5.00, custoBase:2.50, demandaBase:50, perecivel:false, estoqueIni:80}
  ],
  fornecedores:[
    {id:"DIST", nome:"Distribuidora regional", mult:1.00, prazo:2, loteMin:100},
    {id:"PAD",  nome:"Padaria local",          mult:1.25, prazo:1, loteMin:20}
  ]
};
const PROF_SENHA = "prof2026";

/* ================= ESTADO ================= */
const K="cantina_mvp_v1";
let S=null;
function novoEstado(){
  const est={},prc={};
  CEN.produtos.forEach(p=>{est[p.id]=p.estoqueIni;prc[p.id]=p.precoRef;});
  return {equipe:"",papel:"",rodada:1,caixa:CEN.caixaInicial,estoque:est,precos:prc,
    marketing:CEN.mktReferencia,pedidos:[],historico:[],lancamentos:[],log:[],
    analise:"",debriefing:[],finalizado:false};
}
function salvar(){localStorage.setItem(K,JSON.stringify(S));}
function carregar(){const r=localStorage.getItem(K);S=r?JSON.parse(r):novoEstado();}

/* ================= LOG DE USO (instrumentação da pesquisa) ================= */
function log(acao,aba,detalhe){
  S.log.push({ts:new Date().toISOString(),rodada:S.rodada,papel:S.papel||"-",acao:acao,aba:aba||"-",detalhe:detalhe||""});
  if(S.log.length>4000)S.log.shift();
  salvar();
}

/* ================= UTILIDADES ================= */
/* Diálogo na própria página. Substitui alert() e confirm(), que somem ao
   fechar, não são anunciados de forma confiável por leitor de tela e são
   bloqueados quando o objeto roda dentro de um iframe (Moodle, por ex.). */
let _aviso=null;
function avisar(titulo,texto){
  return new Promise(res=>{
    const o=document.createElement("div");o.className="ovl";
    o.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgT">'+
      '<h2 id="dlgT">'+titulo+'</h2><p>'+texto+'</p>'+
      '<div class="bt"><button class="act" id="dlgOk">Entendi</button></div></div>';
    document.body.appendChild(o);
    const ok=o.querySelector("#dlgOk");ok.focus();
    const fim=()=>{o.remove();res(true)};
    ok.onclick=fim;
    o.onkeydown=e=>{if(e.key==="Escape")fim();};
  });
}
function perguntar(titulo,texto,rotuloSim){
  return new Promise(res=>{
    const o=document.createElement("div");o.className="ovl";
    o.innerHTML='<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgT2">'+
      '<h2 id="dlgT2">'+titulo+'</h2><p>'+texto+'</p>'+
      '<div class="bt"><button class="gh" id="dlgNao">Cancelar</button>'+
      '<button class="act" id="dlgSim">'+(rotuloSim||"Confirmar")+'</button></div></div>';
    document.body.appendChild(o);
    const sim=o.querySelector("#dlgSim"),nao=o.querySelector("#dlgNao");
    nao.focus();
    const fim=v=>{o.remove();res(v)};
    sim.onclick=()=>fim(true);nao.onclick=()=>fim(false);
    o.onkeydown=e=>{if(e.key==="Escape")fim(false);};
  });
}
/* Região anunciada por leitor de tela quando algo muda sem recarregar. */
function anunciar(txt){
  let r=document.getElementById("vivo");
  if(!r){r=document.createElement("div");r.id="vivo";r.setAttribute("aria-live","polite");
         r.setAttribute("role","status");
         r.style.cssText="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap";
         document.body.appendChild(r);}
  r.textContent="";setTimeout(()=>{r.textContent=txt;},60);
}
const money=v=>"R$ "+(Math.round(v*100)/100).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const prod=id=>CEN.produtos.find(p=>p.id===id);
const forn=id=>CEN.fornecedores.find(f=>f.id===id);
const custoUnit=(pid,fid)=>prod(pid).custoBase*forn(fid).mult;
function emTransito(pid){return S.pedidos.filter(o=>o.produto===pid&&o.chegaEm>S.rodada).reduce((a,b)=>a+b.qtd,0);}

/* ================= MOTOR DE SIMULAÇÃO ================= */
function fatoresDemanda(pid,preco,mkt,rodada){
  const p=prod(pid);
  const efPreco=Math.pow(p.precoRef/Math.max(preco,0.01),CEN.elasticidade);
  const efMkt=1+CEN.kMarketing*(mkt/CEN.mktReferencia);
  const saz=CEN.sazonalidade[rodada-1]!==undefined?CEN.sazonalidade[rodada-1]:1;
  return {base:p.demandaBase, efPreco:efPreco, efMkt:efMkt, saz:saz,
          demanda:Math.max(0,Math.round(p.demandaBase*efPreco*efMkt*saz))};
}
function calcDemanda(pid,preco,mkt,rodada){
  return fatoresDemanda(pid,preco,mkt,rodada).demanda;
}
function processarRodada(){
  const r=S.rodada, linha={rodada:r,itens:[],marketing:S.marketing,receita:0,custoCompras:0,perdas:0,perdaValor:0};
  // 1) recebimentos
  S.pedidos.filter(o=>o.chegaEm===r&&!o.recebido).forEach(o=>{
    S.estoque[o.produto]+=o.qtd;o.recebido=true;
    S.lancamentos.push({rodada:r,tipo:"Recebimento",desc:o.qtd+" un "+prod(o.produto).nome+" ("+forn(o.fornecedor).nome+")",valor:0});
  });
  // 2) demanda, vendas, ruptura
  CEN.produtos.forEach(p=>{
    const fat=fatoresDemanda(p.id,S.precos[p.id],S.marketing,r);
    const dem=fat.demanda;
    const disp=S.estoque[p.id];
    const vend=Math.min(dem,disp);
    const rup=dem-vend;
    const rec=vend*S.precos[p.id];
    const rupV=rup*S.precos[p.id];
    S.estoque[p.id]=disp-vend;
    let perda=0,perdaV=0;
    if(p.perecivel&&S.estoque[p.id]>0){perda=S.estoque[p.id];perdaV=perda*p.custoBase;S.estoque[p.id]=0;}
    linha.itens.push({produto:p.id,preco:S.precos[p.id],demanda:dem,disponivel:disp,vendas:vend,ruptura:rup,rupturaValor:rupV,receita:rec,perda:perda,perdaValor:perdaV,fat:fat});
    linha.receita+=rec;linha.perdas+=perda;linha.perdaValor+=perdaV;
    if(rec>0)S.lancamentos.push({rodada:r,tipo:"Venda",desc:vend+" un "+p.nome,valor:rec});
    if(perda>0)S.lancamentos.push({rodada:r,tipo:"Perda",desc:perda+" un "+p.nome+" (validade) — custo ja pago na compra: "+money(perdaV),valor:0});
  });
  // 3) custos
  const compras=S.pedidos.filter(o=>o.rodadaPedido===r).reduce((a,b)=>a+b.total,0);
  linha.custoCompras=compras;
  S.lancamentos.push({rodada:r,tipo:"Marketing",desc:"Investimento da rodada",valor:-S.marketing});
  S.lancamentos.push({rodada:r,tipo:"Custos fixos",desc:"Aluguel, energia, pessoal",valor:-CEN.custosFixos});
  linha.custosFixos=CEN.custosFixos;
  linha.lucro=linha.receita-compras-S.marketing-CEN.custosFixos;
  S.caixa+=linha.lucro;
  linha.caixaFinal=S.caixa;
  linha.analise=S.analise;
  S.historico.push(linha);
  log("processar_rodada","rodada","lucro="+linha.lucro.toFixed(2));
  S.rodada++;S.analise="";
  if(S.rodada>CEN.rodadas)S.finalizado=true;
  salvar();
  return linha;
}
/* ================= PAPÉIS E ABAS ================= */
const PAPEIS={
 "Compras e Estoque":["painel","compras","estoque","relatorios","rodada","debriefing"],
 "Vendas e Marketing":["painel","vendas","relatorios","rodada","debriefing"],
 "Financeiro":["painel","financeiro","relatorios","rodada","debriefing"],
 "Coordenação (vê tudo)":["painel","compras","estoque","vendas","financeiro","relatorios","rodada","debriefing"],
 "Professor":["painel","professor","relatorios"]
};
const ABAS={painel:"Painel",compras:"Compras",estoque:"Estoque",vendas:"Vendas",financeiro:"Financeiro",
 relatorios:"Relatórios",rodada:"Rodada",debriefing:"Debriefing (balanço)",professor:"Console"};
let abaAtual="painel";

/* ================= CSV ================= */
function baixar(nome,txt){
  const b=new Blob(["﻿"+txt],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=nome;a.click();
  log("exportar_csv","relatorios",nome);
}
function csv(linhas){return linhas.map(l=>l.map(c=>{
  const s=String(c==null?"":c);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(";")).join("\n");}
function csvEstoque(){
  const L=[["produto","nome","saldo","em_transito","preco_atual","perecivel"]];
  CEN.produtos.forEach(p=>L.push([p.id,p.nome,S.estoque[p.id],emTransito(p.id),S.precos[p.id],p.perecivel?"sim":"nao"]));
  baixar("estoque_rodada"+S.rodada+".csv",csv(L));
}
function csvHistorico(){
  const L=[["rodada","produto","preco","demanda","disponivel","vendas","ruptura","receita","perda_un"]];
  S.historico.forEach(h=>h.itens.forEach(i=>L.push([h.rodada,i.produto,i.preco,i.demanda,i.disponivel,i.vendas,i.ruptura,i.receita.toFixed(2),i.perda])));
  const R=[["rodada","receita","custo_compras","marketing","custos_fixos","perda_valor","lucro","caixa_final"]];
  S.historico.forEach(h=>R.push([h.rodada,h.receita.toFixed(2),h.custoCompras.toFixed(2),h.marketing,h.custosFixos,h.perdaValor.toFixed(2),h.lucro.toFixed(2),h.caixaFinal.toFixed(2)]));
  baixar("historico_equipe.csv",csv(L)+"\n\n"+csv(R));
}
function csvLancamentos(){
  const L=[["rodada","tipo","descricao","valor"]];
  S.lancamentos.forEach(l=>L.push([l.rodada,l.tipo,l.desc,l.valor.toFixed(2)]));
  baixar("financeiro_equipe.csv",csv(L));
}
function csvLog(){
  const L=[["timestamp","rodada","papel","acao","aba","detalhe"]];
  S.log.forEach(l=>L.push([l.ts,l.rodada,l.papel,l.acao,l.aba,l.detalhe]));
  baixar("log_uso_"+(S.equipe||"equipe")+".csv",csv(L));
}

/* ================= RENDER ================= */
function el(h){const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild;}
function topo(){
  document.getElementById("bTeam").textContent=S.equipe||"sem equipe";
  document.getElementById("bRole").textContent=S.papel||"sem papel";
  const feitas=S.historico.length;
  const bR=document.getElementById("bRound");
  bR.innerHTML='<span class="prog" aria-hidden="true">'+
    Array.from({length:CEN.rodadas},(_,i)=>'<i class="'+(i<feitas?"f":(i===feitas&&!S.finalizado?"a":""))+'"></i>').join("")+
    '</span> <span>'+(S.finalizado?"Encerrado":("Rodada "+S.rodada+"/"+CEN.rodadas))+'</span>';
  bR.style.display="flex";bR.style.alignItems="center";bR.style.gap="7px";
  document.getElementById("bCash").textContent=money(S.caixa);
}
function navRender(){
  const n=document.getElementById("nav");n.innerHTML="";
  const abas=PAPEIS[S.papel]||["painel"];
  abas.forEach(a=>{
    const b=document.createElement("button");b.textContent=ABAS[a];
    if(a===abaAtual)b.className="on";
    b.onclick=()=>{abaAtual=a;log("abrir_aba",a);render();};
    n.appendChild(b);
  });
}
function render(){
  carregarSeVazio();topo();navRender();
  const m=document.getElementById("main");m.innerHTML="";
  if(!S.equipe||!S.papel){m.appendChild(telaSetup());return;}
  const abas=PAPEIS[S.papel]||[];
  if(!abas.includes(abaAtual))abaAtual=abas[0];
  m.appendChild(({painel:telaPainel,compras:telaCompras,estoque:telaEstoque,vendas:telaVendas,
    financeiro:telaFinanceiro,relatorios:telaRelatorios,rodada:telaRodada,debriefing:telaDebriefing,
    professor:telaProfessor})[abaAtual]());
}
function carregarSeVazio(){if(!S)carregar();}
/* ---------- SETUP ---------- */
function telaSetup(){
  const d=el('<div class="card"><h2>Identificação</h2></div>');
  d.innerHTML+='<p class="hint">Sem cadastro e sem dados pessoais: use apenas o nome da equipe combinado com a turma.</p>'+
   '<label>Nome da equipe</label><input id="iEq" placeholder="Ex.: Equipe 1">'+
   '<label>Seu papel</label><select id="iPa">'+Object.keys(PAPEIS).map(p=>'<option>'+p+'</option>').join("")+'</select>'+
   '<p></p><button class="act" id="bOk">Entrar</button>';
  setTimeout(()=>{document.getElementById("bOk").onclick=()=>{
    const e=document.getElementById("iEq").value.trim(),p=document.getElementById("iPa").value;
    if(!e){avisar("Falta o nome da equipe","Use o nome combinado com a turma. Sem ele as decisões não podem ser atribuídas à equipe.");return;}
    if(p==="Professor"&&prompt("Senha do professor:")!==PROF_SENHA){avisar("Senha incorreta","O console do professor exige a senha combinada.");return;}
    S.equipe=e;S.papel=p;abaAtual=(PAPEIS[p]||["painel"])[0];log("entrar","setup",p);salvar();render();};},0);
  return d;
}
/* ---------- PAINEL ---------- */
function telaPainel(){
  const d=document.createElement("div");
  const ult=S.historico[S.historico.length-1];
  if(!S.finalizado) d.appendChild(el(trilha()));
  d.appendChild(el('<div class="card"><h2>Situação atual</h2><div class="kpis">'+
   '<div class="kpi"><b>'+money(S.caixa)+'</b><span>Caixa</span></div>'+
   '<div class="kpi"><b>'+(S.finalizado?"—":S.rodada)+'</b><span>Rodada</span></div>'+
   CEN.produtos.map(p=>'<div class="kpi"><b>'+S.estoque[p.id]+'</b><span>'+p.nome+'</span></div>').join("")+
   '</div></div>'));
  if(ult){
    d.appendChild(el('<div class="card" id="resultadoRodada"><h2>Resultado da rodada '+ult.rodada+'</h2>'+
     '<table><tr><th>Produto</th><th class="n">Preço</th><th class="n">Demanda</th><th class="n">Vendas</th>'+
     '<th class="n">Ruptura</th><th class="n">Receita perdida</th><th class="n">Perda</th></tr>'+
     ult.itens.map(i=>'<tr><td>'+prod(i.produto).nome+'</td><td class="n">'+money(i.preco)+'</td><td class="n">'+i.demanda+'</td><td class="n">'+i.vendas+'</td><td class="n">'+(i.ruptura>0?'<b style="color:#B3261E">'+i.ruptura+'</b>':0)+'</td><td class="n">'+(i.ruptura>0?'<b style="color:#B3261E">'+money(i.rupturaValor||0)+'</b>':money(0))+'</td><td class="n">'+(i.perda>0?'<b style="color:#8A6D00">'+i.perda+'</b>':0)+'</td></tr>').join("")+
     '</table><p class="hint">Receita '+money(ult.receita)+' · Compras '+money(ult.custoCompras)+' · Marketing '+money(ult.marketing)+
     ' · Fixos '+money(ult.custosFixos)+' · Perdas '+money(ult.perdaValor)+' · <b>Lucro '+money(ult.lucro)+'</b></p>'+
     porqueDaRodada(ult)+'</div>'));
  } else {
    d.appendChild(el('<div class="card"><p class="msg warn">Primeira rodada. Consulte o seu módulo, exporte os dados, monte a análise e submeta a decisão na aba <b>Rodada</b>.</p></div>'));
  }
  if(!S.finalizado){
    const nomeSaz=["semana comum","semana de provas","semana comum","evento no campus","fim de semestre"];
    const saz=CEN.sazonalidade[S.rodada-1];
    let aviso='';
    if(saz>1.02) aviso='<p class="msg warn"><b>Rodada '+S.rodada+' — '+nomeSaz[S.rodada-1]+'.</b> '+
      'A procura tende a subir cerca de '+Math.round((saz-1)*100)+'%. Estoque curto hoje vira ruptura amanhã.</p>';
    else if(saz<0.98) aviso='<p class="msg warn"><b>Rodada '+S.rodada+' — '+nomeSaz[S.rodada-1]+'.</b> '+
      'A procura tende a cair cerca de '+Math.round((1-saz)*100)+'%. Comprar demais hoje vira perda por validade.</p>';
    d.appendChild(el('<div class="card"><h2>O que pesa nesta rodada</h2>'+aviso+
     '<p class="hint">O <b>salgado assado</b> vence em uma rodada: o que sobrar é perdido. '+
     'A <b>distribuidora</b> entrega em 2 rodadas (lote mínimo 100); a <b>padaria</b> entrega em 1 rodada '+
     '(lote mínimo 20), porém mais cara. Quem compra hoje está decidindo para depois de amanhã.</p></div>'));
  }
  return d;
}
/* ---------- COMPRAS ---------- */
function telaCompras(){
  const d=document.createElement("div");
  const c=el('<div class="card"><h2>Nova compra</h2></div>');
  c.innerHTML+='<div class="row">'+
   '<div><label>Produto</label><select id="cP">'+CEN.produtos.map(p=>'<option value="'+p.id+'">'+p.nome+'</option>').join("")+'</select></div>'+
   '<div><label>Fornecedor</label><select id="cF">'+CEN.fornecedores.map(f=>'<option value="'+f.id+'">'+f.nome+' (prazo '+f.prazo+', lote '+f.loteMin+')</option>').join("")+'</select></div>'+
   '<div><label>Quantidade</label><input id="cQ" type="number" min="0" step="1" value="0"></div></div>'+
   '<p id="cInfo" class="hint"></p><button class="act" id="cB">Registrar pedido</button>';
  d.appendChild(c);
  const t=el('<div class="card"><h2>Pedidos</h2></div>');
  t.innerHTML+= S.pedidos.length? '<table><tr><th>Rodada</th><th>Produto</th><th>Fornecedor</th><th class="n">Qtd</th><th class="n">Total</th><th>Chega em</th><th>Status</th></tr>'+
    S.pedidos.map(o=>'<tr><td>'+o.rodadaPedido+'</td><td>'+prod(o.produto).nome+'</td><td>'+forn(o.fornecedor).nome+'</td><td class="n">'+o.qtd+'</td><td class="n">'+money(o.total)+'</td><td>'+o.chegaEm+'</td><td>'+(o.recebido?"recebido":"em trânsito")+'</td></tr>').join("")+'</table>'
    :'<p class="hint">Nenhum pedido registrado.</p>';
  d.appendChild(t);
  setTimeout(()=>{
    const upd=()=>{const p=document.getElementById("cP").value,f=document.getElementById("cF").value,q=+document.getElementById("cQ").value||0;
      document.getElementById("cInfo").textContent="Custo unitário "+money(custoUnit(p,f))+" · Total "+money(custoUnit(p,f)*q)+" · Chega na rodada "+(S.rodada+forn(f).prazo);};
    ["cP","cF","cQ"].forEach(i=>document.getElementById(i).addEventListener("input",upd));upd();
    document.getElementById("cB").onclick=()=>{
      const p=document.getElementById("cP").value,f=document.getElementById("cF").value,q=+document.getElementById("cQ").value||0;
      if(q<=0){avisar("Falta a quantidade","Informe quantas unidades quer comprar.");return;}
      if(q<forn(f).loteMin){avisar("Abaixo do lote mínimo","Este fornecedor só vende a partir de "+forn(f).loteMin+" unidades. Aumente a quantidade ou escolha outro fornecedor.");return;}
      const total=custoUnit(p,f)*q;
      const comprometido=S.pedidos.filter(o=>o.rodadaPedido===S.rodada).reduce((a,b)=>a+b.total,0);
      if(total+comprometido>S.caixa){avisar("Caixa insuficiente","Disponível: "+money(S.caixa)+"\nJá comprometido nesta rodada: "+money(comprometido)+"\nEsta compra: "+money(total));return;}
      S.pedidos.push({produto:p,fornecedor:f,qtd:q,total:total,rodadaPedido:S.rodada,chegaEm:S.rodada+forn(f).prazo,recebido:false});
      S.lancamentos.push({rodada:S.rodada,tipo:"Compra",desc:q+" un "+prod(p).nome+" ("+forn(f).nome+") — pago no fechamento da rodada",valor:-total});
      log("registrar_compra","compras",p+"/"+f+"/"+q);salvar();render();};
  },0);
  return d;
}

/* ---------- RODADA ---------- */
function telaRodada(){
  const d=document.createElement("div");
  if(S.finalizado){d.appendChild(el('<div class="card"><p class="msg ok">Simulação encerrada. Exporte os dados em Relatórios e registre o Debriefing.</p></div>'));return d;}
  d.appendChild(el(trilha()));
  const r=el('<div class="card"><h2>Submeter decisão da rodada '+S.rodada+'</h2></div>');
  r.innerHTML+='<table><tr><th>Produto</th><th class="n">Preço</th><th class="n">Estoque</th><th class="n">Em trânsito</th></tr>'+
   CEN.produtos.map(p=>'<tr><td>'+p.nome+'</td><td class="n">'+money(S.precos[p.id])+'</td><td class="n">'+S.estoque[p.id]+'</td><td class="n">'+emTransito(p.id)+'</td></tr>').join("")+
   '</table><p class="hint">Marketing: '+money(S.marketing)+' · Caixa: '+money(S.caixa)+'</p>'+
   '<label>Análise que fundamenta a decisão (obrigatória)</label>'+
   '<textarea id="rA" placeholder="Que dados vocês consultaram? Qual a projeção de demanda? Por que este preço e esta compra?">'+(S.analise||"")+'</textarea>'+
   '<p></p><button class="act" id="rB">Processar rodada</button>'+
   '<p class="hint">Ao processar, a rodada é fechada e os resultados são calculados. Não é possível desfazer.</p>';
  d.appendChild(r);
  setTimeout(()=>{
    document.getElementById("rA").addEventListener("input",e=>{S.analise=e.target.value;salvar();});
    document.getElementById("rB").onclick=async()=>{
      const a=(document.getElementById("rA").value||"").trim();
      if(a.length<40){
        log("bloqueio_sem_analise","rodada");
        await avisar("Falta a análise",
          "Antes de processar, descreva em que dados a equipe se baseou e por que decidiu assim. "+
          "São pelo menos 40 caracteres.\n\nÉ esta análise que será avaliada — não o lucro do jogo.");
        document.getElementById("rA").focus();return;}
      if(!await perguntar("Processar a rodada "+S.rodada+"?",
          "A rodada será fechada e os resultados calculados. Não é possível desfazer.",
          "Processar"))return;
      S.analise=a;const l=processarRodada();
      const rodFeita=l.rodada;
      abaAtual="painel";render();
      anunciar("Rodada "+rodFeita+" processada. Lucro "+money(l.lucro)+". Veja o resultado por produto no painel.");
      const alvo=document.getElementById("resultadoRodada");
      if(alvo){alvo.setAttribute("tabindex","-1");alvo.focus();alvo.scrollIntoView({block:"start"});}};
  },0);
  return d;
}
/* ---------- TRILHA DA RODADA ----------
   O fluxo pretendido — consultar os dados, montar a análise, decidir,
   ler o resultado — estava implícito na ordem das abas. Aqui ele vira
   visível, e cada passo é marcado a partir do que a equipe de fato fez
   nesta rodada, lido do próprio registro de uso. Não é enfeite: é a
   regra pedagógica do objeto (nenhuma decisão sem análise) exposta na
   interface. */
function passosDaRodada(){
  const r=S.rodada;
  const ev=(S.log||[]).filter(e=>e.rodada===r);
  const consultou=ev.some(e=>(e.acao==="abrir_aba"&&e.aba==="relatorios")||e.acao==="exportar_csv");
  const analisou=(S.analise||"").trim().length>=40;
  const decidiu=ev.some(e=>e.acao==="salvar_precos"||e.acao==="registrar_compra");
  const leu=S.historico.length>0;
  return [
   {t:"Consultar os dados", d:"Relatórios, estoque e histórico", ok:consultou},
   {t:"Montar a análise",   d:"Em planilha ou banco, fora daqui", ok:analisou},
   {t:"Decidir",            d:"Preço, marketing e compras",      ok:decidiu},
   {t:"Ler o resultado",    d:"Painel, depois de processar",     ok:leu}
  ];
}
function trilha(){
  const ps=passosDaRodada();
  const iAgora=ps.findIndex(x=>!x.ok);
  return '<ol class="trilha" aria-label="Etapas da rodada '+S.rodada+'">'+
    ps.map((x,i)=>{
      const cls = x.ok ? "feito" : (i===iAgora ? "agora" : "");
      const est = x.ok ? "concluído" : (i===iAgora ? "etapa atual" : "ainda não iniciado");
      return '<li class="'+cls+'"><span class="num" aria-hidden="true">'+(x.ok?"&#10003;":(i+1))+'</span>'+
             '<span><b>'+x.t+'</b><small>'+x.d+'</small>'+
             '<span class="hide">'+est+'</span></span></li>';
    }).join("")+'</ol>';
}
/* ---------- POR QUE DEU ISSO: atribui cada resultado à decisão ----------
   O motor calcula a demanda como base x efeito do preço x efeito do
   marketing x sazonalidade. Expor essa decomposição é o que separa um
   retorno igual para todas as equipes de um retorno que varia conforme
   a decisão tomada — e permite ao estudante corrigir sozinho na rodada
   seguinte, sem depender do professor para interpretar o número. */
function efeitoTxt(mult,base){
  const un=Math.round(base*mult)-Math.round(base);
  if(Math.abs(mult-1)<0.005) return '<span class="gl">sem efeito</span>';
  const cls=mult>1?"sobe":"desce", sin=un>0?"+":"";
  return '<span class="'+cls+'">'+sin+un+' un</span> <span class="gl">(x'+mult.toFixed(2)+')</span>';
}
function porqueDaRodada(l){
  const nomeSaz=["semana comum","semana de provas","semana comum","evento no campus","fim de semestre"];
  const corpo = l.itens.map(i=>{
    const f=i.fat; if(!f) return "";
    const p=prod(i.produto);
    const dPreco=i.preco-p.precoRef;
    const rotPreco = Math.abs(dPreco)<0.005
      ? 'Seu preço de '+money(i.preco)+', igual à referência'
      : 'Seu preço de '+money(i.preco)+', '+(dPreco>0?'acima':'abaixo')+' da referência de '+money(p.precoRef);
    let fecho=[];
    if(i.ruptura>0) fecho.push('<b>Faltou produto.</b> '+i.ruptura+' unidades não foram vendidas por falta de estoque, '+
       'o que deixou <b>'+money(i.rupturaValor||0)+'</b> de receita na mesa.');
    if(i.perda>0) fecho.push('<b>Sobrou produto perecível.</b> '+i.perda+' unidades venceram, e o custo de <b>'+
       money(i.perdaValor||0)+'</b> já tinha sido pago na compra.');
    if(i.ruptura===0&&i.perda===0) fecho.push('<b>Estoque bem dimensionado:</b> sem falta e sem perda por validade.');
    const linha=(a,b)=>'<li><span>'+a+'</span><span>'+b+'</span></li>';
    return '<div class="pq"><h4>'+p.nome+' — por que a demanda foi '+i.demanda+'?</h4><ul>'+
      linha('Ponto de partida do produto','<b>'+f.base+' un</b>')+
      linha(rotPreco, efeitoTxt(f.efPreco,f.base))+
      linha('Marketing de '+money(l.marketing), efeitoTxt(f.efMkt,f.base*f.efPreco))+
      linha('Rodada '+l.rodada+', '+(nomeSaz[l.rodada-1]||"semana comum"), efeitoTxt(f.saz,f.base*f.efPreco*f.efMkt))+
      linha('<b>Demanda da rodada</b>','<b>'+i.demanda+' un</b>')+
      '</ul><p class="tot">Tinha <b>'+i.disponivel+'</b> em estoque e vendeu <b>'+i.vendas+'</b>. '+
      fecho.join(" ")+'</p></div>';
  }).join("");
  return '<div class="pqs"><h3>Por que deu isso</h3>'+corpo+'</div>';
}

   a decisão tomada — e permite ao estudante corrigir sozinho na rodada
   seguinte, sem depender do professor para interpretar o número. */
function efeitoTxt(mult,base){
  const un=Math.round(base*mult)-Math.round(base);
  if(Math.abs(mult-1)<0.005) return '<span class="gl">sem efeito</span>';
  const cls=mult>1?"sobe":"desce", sin=un>0?"+":"";
  return '<span class="'+cls+'">x'+mult.toFixed(2)+'</span> <span class="gl">('+sin+un+' un)</span>';
}
function porqueDaRodada(l){
  const nomeSaz=["semana comum","semana de provas","semana comum","evento no campus","fim de semestre"];
  return l.itens.map(i=>{
    const f=i.fat; if(!f) return "";
    const p=prod(i.produto);
    const dPreco=i.preco-p.precoRef;
    const txtPreco = Math.abs(dPreco)<0.005
      ? 'preço igual ao de referência ('+money(p.precoRef)+')'
      : 'preço '+money(i.preco)+', '+(dPreco>0?'acima':'abaixo')+' da referência de '+money(p.precoRef);
    let frases=[];
    if(i.ruptura>0) frases.push('Faltou produto: <b>'+i.ruptura+' unidades</b> não foram vendidas por falta de estoque, '+
       'o que deixou <b>'+money(i.rupturaValor||0)+'</b> de receita na mesa.');
    if(i.perda>0) frases.push('Sobrou produto perecível: <b>'+i.perda+' unidades</b> venceram, '+
       'e o custo de <b>'+money(i.perdaValor||0)+'</b> já tinha sido pago na compra.');
    if(i.ruptura===0&&i.perda===0) frases.push('Estoque bem dimensionado: sem falta e sem perda por validade.');
    return '<div class="pq"><h3>'+p.nome+' — por que a demanda foi '+i.demanda+'?</h3><ul>'+
      '<li>Ponto de partida do produto: <b>'+f.base+' un</b></li>'+
      '<li>Seu '+txtPreco+': '+efeitoTxt(f.efPreco,f.base)+'</li>'+
      '<li>Marketing de '+money(l.marketing)+': '+efeitoTxt(f.efMkt,f.base*f.efPreco)+'</li>'+
      '<li>Rodada '+l.rodada+' ('+(nomeSaz[l.rodada-1]||"semana comum")+'): '+efeitoTxt(f.saz,f.base*f.efPreco*f.efMkt)+'</li>'+
      '</ul><p class="tot">Demanda <b>'+i.demanda+'</b> · tinha em estoque <b>'+i.disponivel+'</b> · '+
      'vendeu <b>'+i.vendas+'</b>. '+frases.join(" ")+'</p></div>';
  }).join("");
}
/* ---------- DEBRIEFING ---------- */
function telaDebriefing(){
  const d=el('<div class="card"><h2>Debriefing <span class="gl">(balanço da rodada)</span></h2>'+
   '<p class="hint">Debriefing é a conversa de fechamento: a equipe revê a decisão tomada, '+
   'confronta o resultado com o que esperava e registra o que fará diferente. É onde a '+
   'experiência vira aprendizado — sem ela, o jogo é só jogo.</p></div>');
  const Q=["O que decidimos nesta rodada?","Com base em qual dado decidimos?","Qual foi o resultado, comparado ao esperado?","O que faremos diferente na próxima rodada?"];
  const reg=S.debriefing.find(x=>x.rodada===S.rodada-1);
  d.innerHTML+='<p class="hint">Registro referente à rodada '+Math.max(1,S.rodada-1)+'.</p>'+
   Q.map((q,i)=>'<label>'+q+'</label><textarea class="dbQ" data-i="'+i+'">'+(reg?reg.resp[i]||"":"")+'</textarea>').join("")+
   '<p></p><button class="act" id="dB">Salvar balanço</button>';
  setTimeout(()=>{document.getElementById("dB").onclick=()=>{
    const resp=[...document.querySelectorAll(".dbQ")].map(t=>t.value);
    const rd=Math.max(1,S.rodada-1);
    S.debriefing=S.debriefing.filter(x=>x.rodada!==rd);
    S.debriefing.push({rodada:rd,resp:resp});
    log("salvar_debriefing","debriefing","rodada="+rd);salvar();anunciar("Balanço salvo.");avisar("Balanço salvo","As respostas da equipe foram registradas.");};},0);
  return d;
}
/* ---------- CONSOLE DO PROFESSOR ---------- */
function telaProfessor(){
  const d=document.createElement("div");
  const c=el('<div class="card"><h2>Console do professor</h2></div>');
  c.innerHTML+='<p class="hint">Esta instalação guarda apenas a equipe deste dispositivo. Consolide as turmas reunindo os arquivos exportados por cada equipe.</p>'+
   '<div class="kpis"><div class="kpi"><b>'+(S.equipe||"—")+'</b><span>Equipe</span></div>'+
   '<div class="kpi"><b>'+S.historico.length+'</b><span>Rodadas concluídas</span></div>'+
   '<div class="kpi"><b>'+S.log.length+'</b><span>Eventos no log</span></div>'+
   '<div class="kpi"><b>'+money(S.caixa)+'</b><span>Caixa</span></div></div>'+
   '<p></p><button class="act sec" id="pJ">Exportar tudo (JSON)</button> '+
   '<button class="act sec" id="pI">Importar equipe (JSON)</button> '+
   '<button class="act sec" id="pR">Reiniciar simulação</button>'+
   '<input type="file" id="pF" accept="application/json" class="hide">';
  d.appendChild(c);
  const a=el('<div class="card"><h2>Análises registradas por rodada</h2></div>');
  a.innerHTML+= S.historico.length? S.historico.map(h=>'<p><b>Rodada '+h.rodada+':</b> '+(h.analise?h.analise:"<i>sem registro</i>")+'</p>').join("")
    :'<p class="hint">Nenhuma rodada processada.</p>';
  d.appendChild(a);
  setTimeout(()=>{
    document.getElementById("pJ").onclick=()=>{
      const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
      const x=document.createElement("a");x.href=URL.createObjectURL(b);x.download="equipe_"+(S.equipe||"sem_nome")+".json";x.click();log("exportar_json","professor");};
    document.getElementById("pI").onclick=()=>document.getElementById("pF").click();
    document.getElementById("pF").onchange=e=>{const f=e.target.files[0];if(!f)return;
      const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);salvar();render();avisar("Equipe importada","Os dados do arquivo substituíram os desta máquina.");}catch(err){avisar("Arquivo inválido","Não foi possível ler este arquivo. Verifique se é o .json exportado pelo console.");}};r.readAsText(f);};
    document.getElementById("pR").onclick=async()=>{
      if(await perguntar("Apagar os dados desta equipe?",
          "Tudo o que esta equipe registrou neste dispositivo será perdido: decisões, histórico, "+
          "balanços e registro de uso. Exporte o arquivo antes, se ainda não exportou.",
          "Apagar")){
        const p=S.papel;S=novoEstado();S.papel=p;salvar();render();}};
  },0);
  return d;
}
/* ================= INÍCIO ================= */
carregar();
if(!S.equipe){S=novoEstado();salvar();}
render();
window.addEventListener("beforeunload",salvar);
</script>

/* Registro do service worker. Falha em silêncio quando o objeto é aberto
   direto do arquivo (file://), caso em que o jogo roda igual, apenas sem
   instalação nem cache offline. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
